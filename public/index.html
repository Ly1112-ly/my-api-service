<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Hub</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dbeafe, #f8fafc);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .container {
        width: min(900px, 90vw);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(37, 99, 235, 0.15);
      }
      h1 {
        margin-top: 0;
        font-size: 3rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-top: 2rem;
      }
      .card {
        background: #fff;
        border: 1px solid #dbeafe;
        border-radius: 16px;
        padding: 24px;
        text-decoration: none;
        color: #172554;
        display: block;
        transition: 0.2s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(37, 99, 235, 0.12);
      }
      .badge {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: #eff6ff;
        color: #2563eb;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      h2 {
        margin: 0 0 10px;
      }
      p {
        margin: 0;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Focus Hub</h1>
      <div class="grid">
        <a class="card" href="/weather">
          <span class="badge">LIVE</span>
          <h2>Weather Dashboard</h2>
          <p>Track the local forecast and hourly timeline.</p>
        </a>

        <a class="card" href="/todo">
          <span class="badge">TASKS</span>
          <h2>To-do List</h2>
          <p>Organize your day with local storage persistence.</p>
        </a>
      </div>
    </main>
  </body>
</html>
